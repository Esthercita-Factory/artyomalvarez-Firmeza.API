services:
  # 1. Base de datos PostgreSQL local
  postgres:
    image: postgres:16-alpine
    container_name: firmeza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firmeza_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-firmeza_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Servicio de pruebas unitarias (se ejecuta primero)
  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    container_name: firmeza-tests

  # 3. Servicio de la API Web (depende del éxito de las pruebas y la base de datos)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firmeza-api
    depends_on:
      tests:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Key=${JWT_KEY:-FirmezaDevelopmentSecretKeyForJwtTokenGeneration2026!}
      - Jwt__Issuer=${JWT_ISSUER:-FirmezaApi}
      - Jwt__Audience=${JWT_AUDIENCE:-FirmezaClient}
      - ConnectionStrings__DefaultConnection=${DATABASE_URL:-Host=postgres;Port=5432;Database=firmeza_db;Username=postgres;Password=postgres;SSL Mode=Disable}
      - Cors__AllowedOrigins__0=${CORS_ORIGIN:-http://localhost:4200}
      - AdminUser__Password=${ADMIN_PASSWORD:-}
      - AdminUser__Email=${ADMIN_EMAIL:-admin@firmeza.com}
    volumes:
      - receipts_data:/app/Storage/recibos

volumes:
  postgres_data:
  receipts_data:
