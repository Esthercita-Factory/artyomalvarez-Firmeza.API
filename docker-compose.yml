services:
  # 1. Servicio de pruebas unitarias (se ejecuta primero)
  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    container_name: firmeza-tests

  # 2. Servicio de la API Web (depende del éxito de las pruebas)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firmeza-api
    depends_on:
      tests:
        condition: service_completed_successfully
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-FirmezaApi}
      - Jwt__Audience=${JWT_AUDIENCE:-FirmezaClient}
      - ConnectionStrings__DefaultConnection=${DATABASE_URL}
      - Cors__AllowedOrigins__0=${CORS_ORIGIN:-http://localhost:4200}
      - AdminUser__Password=${ADMIN_PASSWORD:-}
      - AdminUser__Email=${ADMIN_EMAIL:-admin@firmeza.com}
    volumes:
      - receipts_data:/app/Storage/recibos

volumes:
  receipts_data:
