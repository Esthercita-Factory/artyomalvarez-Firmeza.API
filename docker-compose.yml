services:
  # 1. Servicio de pruebas unitarias (se ejecuta primero)
  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    container_name: firmeza-tests

  # 2. Servicio de la API Web (depende del éxito de las pruebas)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firmeza-api
    depends_on:
      tests:
        condition: service_completed_successfully
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Key=${JWT_KEY:-ClaveSuperSeguraDeProduccionParaFirmezaApi2026!}
      - Jwt__Issuer=FirmezaApi
      - Jwt__Audience=FirmezaClient
      - ConnectionStrings__DefaultConnection=${DATABASE_URL:-Host=aws-0-us-east-1.pooler.supabase.com;Port=5432;Database=postgres;Username=postgres;Password=tu_contraseña;SSL Mode=Require;Trust Server Certificate=true}
      - Cors__AllowedOrigins__0=http://localhost:4200
    volumes:
      - receipts_data:/app/wwwroot/recibos

volumes:
  receipts_data:
